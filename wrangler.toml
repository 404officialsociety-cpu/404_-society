name = "404--society"
main = "src/worker.js"
compatibility_date = "2025-09-01"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "404-society-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
CASHFREE_ENV = "sandbox"   # change to "production" when you go live
QIKINK_ENV = "sandbox"     # change to "live" when you go live
